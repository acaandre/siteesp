<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ESP32 MQTT</title>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{

      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      background:#0f172a;
    }

    .card{

      width:350px;

      background:#1e293b;

      padding:30px;

      border-radius:20px;

      text-align:center;

      box-shadow:0 0 25px rgba(0,0,0,0.5);
    }

    h1{

      color:white;

      margin-bottom:20px;
    }

    .led{

      width:120px;
      height:120px;

      border-radius:50%;

      background:#333;

      margin:20px auto;

      transition:0.3s;
    }

    .on{

      background:#00ff00;

      box-shadow:
      0 0 20px #00ff00,
      0 0 40px #00ff00,
      0 0 60px #00ff00;
    }

    button{

      width:120px;

      padding:15px;

      margin:10px;

      border:none;

      border-radius:10px;

      font-size:18px;

      font-weight:bold;

      cursor:pointer;

      transition:0.3s;
    }

    .ligar{

      background:#22c55e;

      color:white;
    }

    .desligar{

      background:#ef4444;

      color:white;
    }

    button:hover{

      transform:scale(1.05);
    }

    .status{

      margin-top:20px;

      color:#cbd5e1;

      font-size:18px;
    }

  </style>

</head>
<body>

  <div class="card">

    <h1>ESP32 MQTT</h1>

    <div id="led" class="led"></div>

    <button class="ligar"
            onclick="ligarLed()">

      LIGAR

    </button>

    <button class="desligar"
            onclick="desligarLed()">

      DESLIGAR

    </button>

    <div id="status" class="status">

      Conectando MQTT...

    </div>

  </div>

  <script>

    // =====================================================
    // MQTT
    // =====================================================

    const broker =
    "wss://cea36965124c462a8fd17932fd985fd9.s1.eu.hivemq.cloud:8884/mqtt";

    const options = {

      username: "Esp32Andre",

      password: "Andre8080",

      clientId:
      "WEB_" +
      Math.random().toString(16).substr(2,8),

      clean:true,

      connectTimeout:4000
    };

    const client =
    mqtt.connect(broker, options);

    // =====================================================
    // ELEMENTOS
    // =====================================================

    const led =
    document.getElementById("led");

    const status =
    document.getElementById("status");

    // =====================================================
    // CONEXÃO
    // =====================================================

    client.on("connect", () => {

      console.log("MQTT conectado");

      status.innerHTML =
      "✅ MQTT conectado";

      // ESCUTA STATUS DO LED
      client.subscribe(
        "Esp32Andre/status"
      );
    });

    // =====================================================
    // RECEBER STATUS
    // =====================================================

    client.on("message",
      (topic, message) => {

      const msg =
      message.toString();

      console.log(topic, msg);

      if (topic ===
          "Esp32Andre/status") {

        // ================= ON =================

        if (msg === "ON") {

          led.classList.add("on");

          status.innerHTML =
          "💡 LED LIGADO";
        }

        // ================= OFF =================

        if (msg === "OFF") {

          led.classList.remove("on");

          status.innerHTML =
          "⚫ LED DESLIGADO";
        }
      }
    });

    // =====================================================
    // LIGAR
    // =====================================================

    function ligarLed(){

      client.publish(
        "Esp32Andre/led",
        "ON"
      );
    }

    // =====================================================
    // DESLIGAR
    // =====================================================

    function desligarLed(){

      client.publish(
        "Esp32Andre/led",
        "OFF"
      );
    }

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Controle ESP32 MQTT</title>

  <!-- Biblioteca MQTT -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    body{
      background:#0f172a;
      color:white;
      font-family:Arial;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      margin:0;
    }

    .card{
      background:#1e293b;
      padding:40px;
      border-radius:20px;
      text-align:center;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h1{
      margin-bottom:30px;
    }

    button{
      width:120px;
      height:50px;
      border:none;
      border-radius:10px;
      font-size:18px;
      cursor:pointer;
      margin:10px;
      color:white;
      font-weight:bold;
    }

    .on{
      background:#22c55e;
    }

    .off{
      background:#ef4444;
    }

    #status{
      margin-top:20px;
      font-size:14px;
      color:#94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">

    <h1>ESP32 MQTT</h1>

    <button class="on" onclick="ligarLed()">
      LIGAR
    </button>

    <button class="off" onclick="desligarLed()">
      DESLIGAR
    </button>

    <div id="status">
      Conectando ao broker...
    </div>

  </div>

  <script>

    // =========================
    // CONFIG MQTT
    // =========================

    const broker = "wss://90ee92c80c4f4771a4c4918df5ab212c.s1.eu.hivemq.cloud:8884/mqtt";

    const options = {
      username: "esp32Andre",
      password: "Ac123456",
      reconnectPeriod: 1000,
      connectTimeout: 4000,
    };

    // =========================
    // CONECTAR MQTT
    // =========================

    const client = mqtt.connect(broker, options);

    const status = document.getElementById("status");

    client.on("connect", () => {
      console.log("Conectado MQTT");
      status.innerHTML = "✅ Conectado ao MQTT";
      status.style.color = "#22c55e";
    });

    client.on("error", (err) => {
      console.log(err);
      status.innerHTML = "❌ Erro MQTT";
      status.style.color = "#ef4444";
    });

    // =========================
    // FUNÇÕES
    // =========================

    function ligarLed(){

      client.publish("esp32/led", "ON");

      console.log("LED LIGADO");
    }

    function desligarLed(){

      client.publish("esp32/led", "OFF");

      console.log("LED DESLIGADO");
    }

  </script>

</body>
</html>
